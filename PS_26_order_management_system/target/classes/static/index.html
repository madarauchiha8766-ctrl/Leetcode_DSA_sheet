<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: var(--text-primary);
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-weight: 600;
            letter-spacing: -0.05em;
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 2rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        input, select {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 0.75rem;
            border-radius: 8px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 1.4rem;
        }

        button:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        button.danger {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 0.4rem 0.8rem;
            margin-top: 0;
        }

        button.danger:hover {
            background: var(--danger);
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--glass-border);
        }

        th {
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        td {
            font-size: 0.95rem;
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
        }

        .status-PENDING { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .status-SHIPPED { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .status-DELIVERED { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .status-CANCELLED { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        .action-btns {
            display: flex;
            gap: 0.5rem;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        tbody tr {
            animation: fadeIn 0.3s ease forwards;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Order Management System</h1>
        <p style="color: var(--text-secondary);">Manage your customer orders seamlessly</p>
    </div>

    <div class="glass-panel">
        <h2 style="margin-top: 0; font-size: 1.2rem; margin-bottom: 1.5rem;">Create New Order</h2>
        <form id="orderForm" class="form-grid">
            <input type="hidden" id="orderId">
            <div class="input-group">
                <label>Customer Name</label>
                <input type="text" id="customerName" required placeholder="e.g. Jane Doe">
            </div>
            <div class="input-group">
                <label>Product</label>
                <input type="text" id="product" required placeholder="e.g. MacBook Pro">
            </div>
            <div class="input-group">
                <label>Quantity</label>
                <input type="number" id="quantity" required min="1" value="1">
            </div>
            <div class="input-group">
                <label>Price ($)</label>
                <input type="number" id="price" required min="0" step="0.01" placeholder="999.99">
            </div>
            <div class="input-group" id="statusGroup" style="display: none;">
                <label>Status</label>
                <select id="status">
                    <option value="PENDING">PENDING</option>
                    <option value="SHIPPED">SHIPPED</option>
                    <option value="DELIVERED">DELIVERED</option>
                    <option value="CANCELLED">CANCELLED</option>
                </select>
            </div>
            <div class="input-group">
                <button type="submit" id="submitBtn">Save Order</button>
            </div>
        </form>
    </div>

    <div class="glass-panel" style="overflow-x: auto;">
        <h2 style="margin-top: 0; font-size: 1.2rem;">All Orders</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Customer</th>
                    <th>Product</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="ordersTableBody">
                <!-- Orders will be inserted here -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = '/api/orders';

    document.addEventListener('DOMContentLoaded', fetchOrders);

    document.getElementById('orderForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const id = document.getElementById('orderId').value;
        const customerName = document.getElementById('customerName').value;
        const product = document.getElementById('product').value;
        const quantity = document.getElementById('quantity').value;
        const price = document.getElementById('price').value;
        const status = document.getElementById('status').value || "PENDING";

        const orderData = { customerName, product, quantity: parseInt(quantity), price: parseFloat(price), status };

        try {
            if (id) {
                // Update
                await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });
            } else {
                // Create
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });
            }
            
            resetForm();
            fetchOrders();
        } catch (error) {
            console.error('Error saving order:', error);
            alert('Failed to save order.');
        }
    });

    async function fetchOrders() {
        try {
            const res = await fetch(API_URL);
            const orders = await res.json();
            const tbody = document.getElementById('ordersTableBody');
            tbody.innerHTML = '';

            orders.forEach(order => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>#${order.id}</td>
                    <td>${order.customerName}</td>
                    <td>${order.product}</td>
                    <td>${order.quantity}</td>
                    <td>$${order.price.toFixed(2)}</td>
                    <td><span class="status-badge status-${order.status}">${order.status}</span></td>
                    <td class="action-btns">
                        <button onclick='editOrder(${JSON.stringify(order)})' style="margin-top:0; padding: 0.4rem 0.8rem; background:rgba(255,255,255,0.1)">Edit</button>
                        <button onclick="deleteOrder(${order.id})" class="danger">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error('Error fetching orders:', error);
        }
    }

    async function deleteOrder(id) {
        if (!confirm('Are you sure you want to delete this order?')) return;
        try {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            fetchOrders();
        } catch (error) {
            console.error('Error deleting order:', error);
        }
    }

    function editOrder(order) {
        document.getElementById('orderId').value = order.id;
        document.getElementById('customerName').value = order.customerName;
        document.getElementById('product').value = order.product;
        document.getElementById('quantity').value = order.quantity;
        document.getElementById('price').value = order.price;
        document.getElementById('status').value = order.status;
        
        document.getElementById('statusGroup').style.display = 'flex';
        document.getElementById('submitBtn').textContent = 'Update Order';
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
        document.getElementById('orderForm').reset();
        document.getElementById('orderId').value = '';
        document.getElementById('statusGroup').style.display = 'none';
        document.getElementById('submitBtn').textContent = 'Save Order';
    }
</script>

</body>
</html>
