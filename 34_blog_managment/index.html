<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        header p {
            color: #666;
            font-size: 1.1em;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }

        .form-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .form-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 150px;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .btn-danger {
            background: #ff6b6b;
            color: white;
            padding: 8px 12px;
            font-size: 0.9em;
        }

        .btn-danger:hover {
            background: #ff5252;
        }

        .btn-edit {
            background: #51cf66;
            color: white;
            padding: 8px 12px;
            font-size: 0.9em;
        }

        .btn-edit:hover {
            background: #40c057;
        }

        .posts-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .posts-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .posts-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .post-card {
            background: #f8f9fa;
            border-left: 5px solid #667eea;
            padding: 20px;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .post-card:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateX(5px);
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .post-title {
            color: #667eea;
            font-size: 1.3em;
            font-weight: 700;
            margin: 0;
        }

        .post-author {
            color: #999;
            font-size: 0.9em;
            font-style: italic;
        }

        .post-content {
            color: #555;
            line-height: 1.6;
            margin: 15px 0;
        }

        .post-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
            font-size: 0.85em;
            color: #999;
        }

        .post-actions {
            display: flex;
            gap: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state svg {
            width: 60px;
            height: 60px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .api-status {
            background: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .api-status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff6b6b;
            margin-right: 10px;
        }

        .api-status-indicator.online {
            background: #51cf66;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Blog Management System</h1>
            <p>Create, Read, Update, and Delete Blog Posts</p>
        </header>

        <div class="api-status">
            <div>
                <span class="api-status-indicator" id="apiStatus"></span>
                <span id="apiStatusText">Checking API...</span>
            </div>
            <span id="postCount" style="color: #667eea; font-weight: 600;"></span>
        </div>

        <div id="alertContainer"></div>

        <div class="content">
            <!-- Form Section -->
            <div class="form-section">
                <h2>Create New Post</h2>
                
                <form id="postForm">
                    <div class="form-group">
                        <label for="title">Post Title *</label>
                        <input 
                            type="text" 
                            id="title" 
                            placeholder="Enter post title" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="author">Author Name *</label>
                        <input 
                            type="text" 
                            id="author" 
                            placeholder="Your name" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="content">Post Content *</label>
                        <textarea 
                            id="content" 
                            placeholder="Write your blog post content here..." 
                            required
                        ></textarea>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn-primary" id="submitBtn">
                            Publish Post
                        </button>
                        <button type="reset" class="btn-secondary" id="resetBtn">
                            Clear Form
                        </button>
                    </div>
                </form>
            </div>

            <!-- Posts Section -->
            <div class="posts-section">
                <h2>All Blog Posts</h2>
                <div id="postsList" class="posts-list">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading posts...</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>Blog Management API • Running on http://localhost:3000</p>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        let allPosts = [];
        let editingId = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkAPIStatus();
            loadPosts();
            document.getElementById('postForm').addEventListener('submit', handleFormSubmit);
            setInterval(checkAPIStatus, 5000); // Check every 5 seconds
        });

        // Check API Status
        async function checkAPIStatus() {
            try {
                const response = await fetch(`${API_URL}/health`);
                if (response.ok) {
                    document.getElementById('apiStatus').classList.add('online');
                    document.getElementById('apiStatusText').textContent = '✓ API Online';
                } else {
                    throw new Error('API not responding');
                }
            } catch (error) {
                document.getElementById('apiStatus').classList.remove('online');
                document.getElementById('apiStatusText').textContent = '✗ API Offline';
            }
        }

        // Load all posts
        async function loadPosts() {
            try {
                const response = await fetch(`${API_URL}/posts`);
                if (!response.ok) throw new Error('Failed to load posts');
                
                const data = await response.json();
                allPosts = data.data || [];
                
                renderPosts();
                updatePostCount();
            } catch (error) {
                console.error('Error loading posts:', error);
                document.getElementById('postsList').innerHTML = `
                    <div class="empty-state">
                        <p>❌ Failed to load posts. Make sure the API server is running on http://localhost:3000</p>
                    </div>
                `;
            }
        }

        // Render posts
        function renderPosts() {
            const postsList = document.getElementById('postsList');
            
            if (allPosts.length === 0) {
                postsList.innerHTML = `
                    <div class="empty-state">
                        <p>📝 No blog posts yet. Create your first post!</p>
                    </div>
                `;
                return;
            }

            postsList.innerHTML = allPosts.map(post => `
                <div class="post-card">
                    <div class="post-header">
                        <h3 class="post-title">${escapeHtml(post.title)}</h3>
                        <div class="post-actions">
                            <button class="btn-edit" onclick="editPost('${post.id}')">Edit</button>
                            <button class="btn-danger" onclick="deletePost('${post.id}')">Delete</button>
                        </div>
                    </div>
                    <p class="post-author">By ${escapeHtml(post.author)}</p>
                    <p class="post-content">${escapeHtml(post.content)}</p>
                    <div class="post-meta">
                        <span>📅 ${formatDate(post.createdAt)}</span>
                        <span>Updated: ${formatDate(post.updatedAt)}</span>
                    </div>
                </div>
            `).join('');
        }

        // Handle form submission
        async function handleFormSubmit(e) {
            e.preventDefault();
            
            const title = document.getElementById('title').value.trim();
            const author = document.getElementById('author').value.trim();
            const content = document.getElementById('content').value.trim();

            if (!title || !author || !content) {
                showAlert('Please fill in all fields', 'error');
                return;
            }

            try {
                const submitBtn = document.getElementById('submitBtn');
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<div class="spinner"></div>';

                const method = editingId ? 'PUT' : 'POST';
                const url = editingId ? `${API_URL}/posts/${editingId}` : `${API_URL}/posts`;

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ title, author, content })
                });

                if (!response.ok) throw new Error('Failed to save post');

                showAlert(
                    editingId ? '✓ Post updated successfully!' : '✓ Post created successfully!',
                    'success'
                );

                document.getElementById('postForm').reset();
                editingId = null;
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Publish Post';

                loadPosts();
            } catch (error) {
                showAlert('❌ Error: ' + error.message, 'error');
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('submitBtn').innerHTML = 'Publish Post';
            }
        }

        // Edit post
        async function editPost(postId) {
            try {
                const response = await fetch(`${API_URL}/posts/${postId}`);
                if (!response.ok) throw new Error('Failed to load post');

                const data = await response.json();
                const post = data.data;

                document.getElementById('title').value = post.title;
                document.getElementById('author').value = post.author;
                document.getElementById('content').value = post.content;

                editingId = postId;
                document.getElementById('submitBtn').textContent = 'Update Post';
                document.getElementById('postForm').scrollIntoView({ behavior: 'smooth' });

                showAlert('✏️ Now editing post. Click "Update Post" to save changes.', 'success');
            } catch (error) {
                showAlert('❌ Error: ' + error.message, 'error');
            }
        }

        // Delete post
        async function deletePost(postId) {
            if (!confirm('Are you sure you want to delete this post?')) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/posts/${postId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Failed to delete post');

                showAlert('✓ Post deleted successfully!', 'success');
                loadPosts();
            } catch (error) {
                showAlert('❌ Error: ' + error.message, 'error');
            }
        }

        // Update post count
        function updatePostCount() {
            const count = allPosts.length;
            document.getElementById('postCount').textContent = 
                `${count} ${count === 1 ? 'Post' : 'Posts'}`;
        }

        // Show alert
        function showAlert(message, type) {
            const alertContainer = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} show`;
            alert.textContent = message;

            alertContainer.innerHTML = '';
            alertContainer.appendChild(alert);

            setTimeout(() => {
                alert.classList.remove('show');
                setTimeout(() => alert.remove(), 300);
            }, 4000);
        }

        // Utility functions
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit'
            });
        }
    </script>
</body>
</html>
