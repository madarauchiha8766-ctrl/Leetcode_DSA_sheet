<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Signal Simulator</title>
    <meta name="description" content="A responsive traffic signal light simulator with glowing LEDs.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Traffic Signal Simulator</h1>
            <p>Experience the glowing LED effects and automatic light cycles.</p>
        </header>

        <div class="traffic-light-container">
            <div class="traffic-light">
                <div class="light red" id="redLight"></div>
                <div class="light yellow" id="yellowLight"></div>
                <div class="light green" id="greenLight"></div>
            </div>
            
            <div class="pole"></div>
        </div>

        <div class="controls">
            <button id="btnRed" class="btn red-btn">Red</button>
            <button id="btnYellow" class="btn yellow-btn">Yellow</button>
            <button id="btnGreen" class="btn green-btn">Green</button>
            <button id="btnAuto" class="btn auto-btn active">Auto Mode</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
