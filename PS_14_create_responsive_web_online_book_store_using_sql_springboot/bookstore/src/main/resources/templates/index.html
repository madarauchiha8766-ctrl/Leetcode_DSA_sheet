<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Books | The Premium Bookstore</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav>
        <a href="/" class="logo">Lumina Books</a>
        <div class="nav-links">
            <a href="/catalog">Catalog</a>
            <a href="/book/add">Add Book</a>
            <a href="/cart">Cart</a>
            <div th:if="${!loggedIn}" style="margin-left: 1rem;">
                <a href="/login" class="btn btn-outline" style="margin-right: 1rem;">Login</a>
                <a href="/register" class="btn btn-primary">Sign Up</a>
            </div>
            <div th:if="${loggedIn}" style="display: flex; align-items: center; gap: 1rem; margin-left: 1rem;">
                <span style="color: var(--text-muted);">Welcome, <strong th:text="${username}">User</strong>!</span>
                <a href="/logout" class="btn btn-outline">Logout</a>
            </div>
        </div>
    </nav>

    <div class="hero">
        <h1>Discover Your Next <br><span style="color: var(--primary);">Great Adventure</span></h1>
        <p>Explore a curated collection of premium books tailored for curious minds. Immerse yourself in a world of knowledge and fantasy.</p>
        <div>
            <a href="/catalog" class="btn btn-primary" style="font-size: 1.1rem; padding: 0.8rem 2rem;">Explore Catalog</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Lumina Books. All rights reserved.</p>
    </footer>
</body>
</html>
