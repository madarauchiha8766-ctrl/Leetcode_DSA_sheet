<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book | Lumina Books</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav>
        <a href="/" class="logo">Lumina Books</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/catalog">Catalog</a>
            <a href="/book/add">Add Book</a>
            <a href="/cart">Cart</a>
            <div th:if="${!loggedIn}" style="margin-left: 1rem;">
                <a href="/login" class="btn btn-outline" style="margin-right: 1rem;">Login</a>
                <a href="/register" class="btn btn-primary">Sign Up</a>
            </div>
            <div th:if="${loggedIn}" style="display: flex; align-items: center; gap: 1rem; margin-left: 1rem;">
                <a href="/logout" class="btn btn-outline">Logout</a>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card" style="max-width: 500px;">
            <h2>Add New Book</h2>
            <form action="/book/add" method="post">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" required>
                </div>
                <div class="form-group">
                    <label for="author">Author</label>
                    <input type="text" id="author" name="author" required>
                </div>
                <div class="form-group">
                    <label for="price">Price ($)</label>
                    <input type="number" id="price" name="price" step="0.01" min="0" required>
                </div>
                <div class="form-group">
                    <label for="imageUrl">Image URL</label>
                    <input type="url" id="imageUrl" name="imageUrl" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="4" style="width: 100%; padding: 0.8rem 1rem; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--border); border-radius: 8px; color: white; font-size: 1rem; transition: all 0.3s ease;" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary auth-btn">Add Book to Catalog</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Lumina Books. All rights reserved.</p>
    </footer>
</body>
</html>
