<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Lumina Books</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav>
        <a href="/" class="logo">Lumina Books</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/catalog">Catalog</a>
            <a href="/book/add">Add Book</a>
            <a href="/cart">Cart</a>
            <div th:if="${!loggedIn}" style="margin-left: 1rem;">
                <a href="/login" class="btn btn-outline" style="margin-right: 1rem;">Login</a>
                <a href="/register" class="btn btn-primary" style="background: var(--primary-hover);">Sign Up</a>
            </div>
            <div th:if="${loggedIn}" style="display: flex; align-items: center; gap: 1rem; margin-left: 1rem;">
                <a href="/logout" class="btn btn-outline">Logout</a>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <h2>Create an Account</h2>
            
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

            <form action="/register" method="post">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="Choose a username">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Create a password">
                </div>
                <button type="submit" class="btn btn-primary auth-btn">Create Account</button>
            </form>
            <div class="auth-links">
                Already have an account? <a href="/login">Log in here</a>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Lumina Books. All rights reserved.</p>
    </footer>
</body>
</html>
