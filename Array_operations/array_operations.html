<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Array Operations</title>

<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

<style>
body {
    background: #1f1f2e;
    color: white;
    text-align: center;
    padding: 30px;
}

.container-box {
    background: #2c2c3c;
    padding: 20px;
    border-radius: 10px;
}

button {
    margin: 5px;
}
</style>
</head>

<body>

<h2>JavaScript Array Operations</h2>

<div class="container mt-4 container-box">
    <input type="text" id="arrayInput" class="form-control" placeholder="Enter numbers separated by comma">

    <br>

    <button class="btn btn-primary" onclick="reverseArray()">Reverse</button>
    <button class="btn btn-success" onclick="sortArray()">Sort</button>
    <button class="btn btn-warning" onclick="searchElement()">Search</button>

    <br><br>

    <input type="text" id="searchValue" class="form-control" placeholder="Enter element to search">

    <br>

    <h4>Output:</h4>
    <p id="output"></p>
</div>

<script>

function getArray() {
    let input = document.getElementById("arrayInput").value;
    return input.split(",").map(Number);
}

function reverseArray() {
    let arr = getArray();
    let reversed = arr.reverse();
    document.getElementById("output").innerText = reversed;
}

function sortArray() {
    let arr = getArray();
    let sorted = arr.sort((a,b)=>a-b);
    document.getElementById("output").innerText = sorted;
}

function searchElement() {
    let arr = getArray();
    let value = Number(document.getElementById("searchValue").value);
    let index = arr.indexOf(value);

    if(index !== -1){
        document.getElementById("output").innerText = "Element found at index: " + index;
    } else {
        document.getElementById("output").innerText = "Element not found";
    }
}

</script>

</body>
</html>
