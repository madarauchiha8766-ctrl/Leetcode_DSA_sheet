<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Inventory Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --secondary: #3b82f6;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --surface: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: radial-gradient(circle at top right, #1e1b4b, var(--bg-color), #020617);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .container {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
        }

        /* Form Card */
        .form-card {
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            height: fit-content;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeInLeft 0.8s ease-out;
        }

        .form-card h2 {
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            color: #e0e7ff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.6);
        }

        .btn-cancel {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            margin-top: 0.5rem;
            display: none;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            align-content: start;
        }

        .product-card {
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            animation: fadeInUp 0.5s ease-out;
            animation-fill-mode: both;
        }

        .product-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6);
            border-color: rgba(99, 102, 241, 0.5);
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), #a855f7);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .product-card:hover::before {
            opacity: 1;
        }

        .product-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .product-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
            height: 2.7rem;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .product-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .product-price {
            font-size: 1.5rem;
            font-weight: 800;
            color: #10b981;
        }

        .product-qty {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #e2e8f0;
        }

        .card-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-icon {
            flex: 1;
            padding: 0.6rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-edit {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
        }

        .btn-edit:hover {
            background: var(--secondary);
            color: white;
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }

        .btn-delete:hover {
            background: var(--danger);
            color: white;
        }

        /* Loading & Empty states */
        .loader {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: var(--primary);
            font-size: 2rem;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            background: var(--surface);
            border-radius: 16px;
            border: 1px dashed var(--border);
            color: var(--text-muted);
        }
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #10b981;
            color: white;
            padding: 1rem 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.26, 1.55);
            display: flex;
            align-items: center;
            gap: 0.8rem;
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.error {
            background: var(--danger);
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4);
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Inventory Pro</h1>
        <p>Manage your products with ease and style.</p>
    </div>

    <div class="container">
        
        <!-- Form Section -->
        <div class="form-card">
            <h2 id="formTitle"><i class="fa-solid fa-plus"></i> Add Product</h2>
            <form id="productForm">
                <input type="hidden" id="productId">
                
                <div class="form-group">
                    <label for="name">Product Name</label>
                    <input type="text" id="name" class="form-control" required placeholder="e.g. MacBook Pro M3">
                </div>
                
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" class="form-control" rows="3" required placeholder="Enter product details..."></textarea>
                </div>
                
                <div class="form-group">
                    <label for="price">Price ($)</label>
                    <input type="number" id="price" class="form-control" step="0.01" required placeholder="0.00">
                </div>
                
                <div class="form-group">
                    <label for="quantity">Quantity in Stock</label>
                    <input type="number" id="quantity" class="form-control" required placeholder="0">
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Save Product
                </button>
                <button type="button" class="btn btn-cancel" id="cancelBtn" onclick="resetForm()">
                    Cancel Edit
                </button>
            </form>
        </div>

        <!-- Grid Section -->
        <div class="products-grid" id="productsGrid">
            <!-- Products will be injected here -->
        </div>

    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <i class="fa-solid fa-circle-check" id="toastIcon"></i>
        <span id="toastMsg">Action successful!</span>
    </div>

    <script>
        const API_URL = '/api/products';
        
        // Setup Basic Auth credentials (admin:password)
        const getHeaders = () => {
            const credentials = btoa('admin:password');
            return {
                'Authorization': `Basic ${credentials}`,
                'Content-Type': 'application/json'
            };
        };

        // DOM Elements
        const form = document.getElementById('productForm');
        const productsGrid = document.getElementById('productsGrid');
        const formTitle = document.getElementById('formTitle');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        
        // Fetch all products on load
        document.addEventListener('DOMContentLoaded', fetchProducts);

        async function fetchProducts() {
            productsGrid.innerHTML = '<div class="loader"><i class="fa-solid fa-circle-notch fa-spin"></i></div>';
            try {
                const response = await fetch(API_URL, { headers: getHeaders() });
                if (!response.ok) throw new Error('Failed to fetch data');
                const products = await response.json();
                renderProducts(products);
            } catch (error) {
                console.error('Error:', error);
                showToast('Failed to connect to server. Check Basic Auth.', 'error');
                productsGrid.innerHTML = `<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i><p>Connection Error</p></div>`;
            }
        }

        function renderProducts(products) {
            if (products.length === 0) {
                productsGrid.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-box-open"></i>
                        <p>No products found. Start by adding one!</p>
                    </div>`;
                return;
            }

            productsGrid.innerHTML = '';
            products.forEach((product, index) => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.style.animationDelay = `${index * 0.1}s`;
                
                card.innerHTML = `
                    <div class="product-title">${escapeHTML(product.name)}</div>
                    <div class="product-desc">${escapeHTML(product.description)}</div>
                    <div class="product-meta">
                        <div class="product-price">$${product.price.toFixed(2)}</div>
                        <div class="product-qty"><i class="fa-solid fa-cubes"></i> ${product.quantity} left</div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-icon btn-edit" onclick='editProduct(${JSON.stringify(product).replace(/'/g, "&#39;")})'>
                            <i class="fa-solid fa-pen"></i> Edit
                        </button>
                        <button class="btn-icon btn-delete" onclick="deleteProduct('${product.id}')">
                            <i class="fa-solid fa-trash"></i> Delete
                        </button>
                    </div>
                `;
                productsGrid.appendChild(card);
            });
        }

        // Handle Form Submit (Add / Update)
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const productId = document.getElementById('productId').value;
            const productData = {
                name: document.getElementById('name').value,
                description: document.getElementById('description').value,
                price: parseFloat(document.getElementById('price').value),
                quantity: parseInt(document.getElementById('quantity').value)
            };

            const method = productId ? 'PUT' : 'POST';
            const url = productId ? `${API_URL}/${productId}` : API_URL;

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: getHeaders(),
                    body: JSON.stringify(productData)
                });

                if (response.ok) {
                    showToast(productId ? 'Product updated successfully!' : 'Product added successfully!');
                    resetForm();
                    fetchProducts();
                } else {
                    throw new Error('Server returned an error');
                }
            } catch (error) {
                showToast('Failed to save product.', 'error');
            }
        });

        // Edit Product (Populate form)
        function editProduct(product) {
            document.getElementById('productId').value = product.id;
            document.getElementById('name').value = product.name;
            document.getElementById('description').value = product.description;
            document.getElementById('price').value = product.price;
            document.getElementById('quantity').value = product.quantity;

            formTitle.innerHTML = '<i class="fa-solid fa-pen-to-square"></i> Edit Product';
            submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> Update Product';
            cancelBtn.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Delete Product
        async function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            
            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE',
                    headers: getHeaders()
                });

                if (response.ok) {
                    showToast('Product deleted successfully!');
                    fetchProducts();
                } else {
                    throw new Error('Failed to delete');
                }
            } catch (error) {
                showToast('Failed to delete product.', 'error');
            }
        }

        // Reset Form
        function resetForm() {
            form.reset();
            document.getElementById('productId').value = '';
            formTitle.innerHTML = '<i class="fa-solid fa-plus"></i> Add Product';
            submitBtn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Save Product';
            cancelBtn.style.display = 'none';
        }

        // Utilities
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toastMsg');
            const icon = document.getElementById('toastIcon');
            
            msg.textContent = message;
            if (type === 'error') {
                toast.classList.add('error');
                icon.className = 'fa-solid fa-circle-exclamation';
            } else {
                toast.classList.remove('error');
                icon.className = 'fa-solid fa-circle-check';
            }
            
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }
    </script>
</body>
</html>
