<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f2f5; }
        .login-container { background: white; padding: 2.5rem; border-radius: 10px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #1a1a1a; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; color: #4a4a4a; font-weight: 500; }
        input[type="text"], input[type="password"] { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-size: 1rem; transition: border-color 0.15s ease-in-out; }
        input[type="text"]:focus, input[type="password"]:focus { border-color: #3b82f6; outline: none; }
        button { width: 100%; padding: 0.875rem; background-color: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: 600; transition: background-color 0.15s ease-in-out; }
        button:hover { background-color: #2563eb; }
        .error { color: #b91c1c; background-color: #fee2e2; padding: 1rem; border-radius: 6px; margin-bottom: 1.25rem; border: 1px solid #f87171; font-size: 0.9rem; text-align: center;}
        .logout { color: #15803d; background-color: #dcfce7; padding: 1rem; border-radius: 6px; margin-bottom: 1.25rem; border: 1px solid #86efac; font-size: 0.9rem; text-align: center;}
    </style>
</head>
<body>
<div class="login-container">
    <h2>Secure Login</h2>

    <div th:if="${param.error}" class="error">
        <span th:text="${session[SPRING_SECURITY_LAST_EXCEPTION]?.message} ?: 'Invalid username or password'"></span>
    </div>

    <div th:if="${param.logout}" class="logout">
        You have been logged out successfully.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required autofocus/>
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required/>
        </div>
        <button type="submit">Log In</button>
    </form>
</div>
</body>
</html>
